    ind.className = "ptr"; ind.setAttribute("aria-hidden", "true");
    ind.innerHTML = '<span class="ptr-c"><svg class="ptr-a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span class="ptr-s">' + IC.spin + '</span></span><span class="ptr-t">당겨서 새로고침</span>';
    msg.className = "ptr-msg"; msg.setAttribute("role", "status"); msg.setAttribute("aria-live", "polite");
    B.appendChild(ind); B.appendChild(msg);
    var y0 = null, x0 = 0, on = false, pull = 0, busy = false, READY = 70, REST = 60, msgT = null;
    function can(){
      return !busy && booted && (!MQ || MQ.matches) && !B.classList.contains("login-mode") && !B.classList.contains("mm-open") &&
        !document.querySelector(".shp") && !document.fullscreenElement && !document.webkitFullscreenElement && (window.scrollY || H.scrollTop) <= 0;
    }
    function set(px, anim){
      pull = px;
      H.classList.toggle("ptr-anim", !!anim);
      H.style.setProperty("--ptr", (REDUCE ? 0 : px) + "px");
      ind.style.height = Math.max(px, REDUCE && px ? REST : 0) + "px";
      H.classList.toggle("ptr-on", px > 0 || busy);
    }
    function state(st, txt){ ind.className = "ptr" + (st ? " " + st : ""); ind.querySelector(".ptr-t").textContent = txt; }
    function say(t, ok){
      clearTimeout(msgT); msg.innerHTML = (ok ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '<span>' + t + '</span>';
      msg.classList.toggle("bad", !ok); msg.classList.add("on"); msgT = setTimeout(function(){ msg.classList.remove("on"); }, ok ? 1600 : 2600);
    }
    document.addEventListener("touchstart", function(e){
      y0 = null; if (e.touches.length !== 1 || !can()) return;
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; on = false;
    }, { passive:true });
    document.addEventListener("touchmove", function(e){
      if (y0 == null) return;
      var dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
      if (!on){
        if (dy < 8 && Math.abs(dx) < 8) return;
        if (dy < 8 || Math.abs(dx) > dy || (window.scrollY || H.scrollTop) > 0){ y0 = null; return; }   /* 위로 · 옆으로 밀기는 그냥 스크롤 */
        on = true; y0 += 8; dy -= 8;
      }
      if (e.cancelable) e.preventDefault();                             /* 사파리 · 카톡 기본 당김과 겹치지 않게 */
      var px = Math.min(80, Math.max(0, dy * 0.5));
      set(px, false);
      if (px >= READY) state("ready", "놓으면 새로고침"); else state("", "당겨서 새로고침");
    }, { passive:false });
    function end(){
      if (y0 == null) return; y0 = null;
      if (!on) return; on = false;
      if (pull < READY){ set(0, true); return; }
      busy = true; state("busy", "새로고침 중…"); set(REST, true);
      var t0 = Date.now();
      refreshData().then(function(){ return true; }, function(){ return false; }).then(function(ok){
        setTimeout(function(){                                          /* 너무 빨리 끝나도 돌아가는 원이 잠깐은 보이게 */
          busy = false; set(0, true); setTimeout(function(){ state("", "당겨서 새로고침"); }, 320);
          say(ok ? "새로고침 완료" : "새로 고치지 못했어요 · 다시 당겨 주세요", ok);
        }, Math.max(0, 600 - (Date.now() - t0)));
      });
    }
    document.addEventListener("touchend", end, { passive:true });
    document.addEventListener("touchcancel", end, { passive:true });
  })();

  Promise.all([getJson("data/videos.enc.json"), getJson("data/research.enc.json")]).then(function(enc){
    if (enc[0] && enc[0].ct){
      LOCKED = true; WRAP = enc; GATE = enc[0].gate || "";
      var raw = sesRaw();
      SES = raw && raw.t && raw.k && raw.e > kstNow() ? raw : null;
      if (!SES){ if (raw) sesSet(null); showLogin(raw && raw.t ? "expired" : ""); return; }
      if (!SC.box.ok){ failed(); return; }
      keepStore();
      /* #251 자동 로그인 + 이 탭 처음 + 홈 주소: 인트로 → 홈(움직임 줄이기면 인트로 없이 홈 200ms 페이드) */
      if (INTRO_FRESH && homeEntry()){
        if (INTRO_ON){ setTimeout(renew, 4500); autoIntro(); unPre(); return; }
        setTimeout(renew, 1500);
        return enter().then(function(){ var a = $("app"); a.classList.add("lg-fade"); setTimeout(function(){ a.classList.remove("lg-fade"); }, 260); });
      }
      setTimeout(renew, 1500);
      return enter();
    }
    /* 아직 잠그기 전(관리자가 사번 목록 v18로 저장하기 전): 예전처럼 누구나 */
    return Promise.all([getJson("data/videos.json"), getJson("data/research.json")]).then(function(res){
      if (!res[0]) throw new Error("nodata");
      booted = true; unPre();
      DATA = res[0]; RES = (res[1] && res[1].months) ? res[1] : { months:[] };
      drawNotice((DATA.site || {}).notice);
      route();
    });
  }).catch(failed);
})();
</script>
