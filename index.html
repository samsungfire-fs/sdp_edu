<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>시그니처클래스 교육 자료실</title>
<meta name="description" content="강의 영상을 보고, 현장에서 바로 쓰는 교육자료를 내려받으세요.">
<meta property="og:title" content="시그니처클래스 교육 자료실">
<meta property="og:description" content="강의 영상을 보고, 현장에서 바로 쓰는 교육자료를 내려받으세요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="inapp" id="inapp" hidden>
  <div class="wrap">
    <p id="inappMsg">카카오톡 안에서는 교육자료 다운로드가 막힐 수 있어요.</p>
    <a id="inappBtn" href="#">다른 브라우저로 열기</a>
  </div>
</div>

<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="back" id="back" href="./" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>전체 강의
    </a>
    <a class="brand" id="brand" href="./">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg></span>
      <span id="brandName">시그니처클래스</span>
    </a>
    <span class="top-meta" id="topMeta"></span>
  </div>
</header>

<main id="app" class="wrap">
  <p class="state">불러오는 중…</p>
</main>

<footer class="site-foot">
  <div class="wrap"><p id="notice"></p></div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/common.js"></script>
<script>
(function(){
  var esc = SC.esc, $ = function(id){ return document.getElementById(id); };
  var IC = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  };

  /* ---------- 카카오톡 등 앱 안 브라우저 안내 ---------- */
  var ia = SC.inApp();
  if (ia){
    $("inapp").hidden = false;
    if (ia === "kakao") $("inappBtn").href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    else { $("inappMsg").textContent = "앱 안에서는 교육자료 다운로드가 막힐 수 있어요. 오른쪽 위 메뉴에서 ‘다른 브라우저로 열기’를 눌러 주세요."; $("inappBtn").hidden = true; }
  }
  window.addEventListener("scroll", function(){ $("topbar").classList.toggle("scrolled", window.scrollY > 4); }, { passive:true });

  var toastT;
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2200); }

  function videoUrl(id){ return "./?v=" + encodeURIComponent(id); }
  function metaLine(v, opts){
    var parts = [];
    if (v.channel) parts.push(esc(v.channel));
    if (v.date) parts.push(SC.fmtDate(v.date));
    if (opts && opts.files && (v.files || []).length) parts.push("자료 " + v.files.length + "개");
    return '<div class="meta">' + parts.join('<span class="dot" aria-hidden="true"></span>') + '</div>';
  }
  function thumbBox(v, eager){
    return '<div class="thumb">' + SC.thumbImg(v.id, eager) +
      (SC.isNew(v.date) ? '<span class="chip new">NEW</span>' : '') +
      (v.duration ? '<span class="chip dur">' + esc(v.duration) + '</span>' : '') +
      '<span class="play">' + IC.play + '</span></div>';
  }
  function card(v){
    return '<li><a class="card" href="' + videoUrl(v.id) + '">' + thumbBox(v) +
      '<div class="info"><h3>' + esc(v.title || "제목 없음") + '</h3>' + metaLine(v, { files:true }) + '</div></a></li>';
  }

  /* ---------- 홈 ---------- */
  function renderHome(data){
    var S = data.site || {}, V = data.videos || [];
    document.title = S.title || "교육 자료실";
    $("topMeta").textContent = V.length ? "강의 " + V.length + "개" : "";
    var html = '<section class="hero">' +
      (S.eyebrow ? '<div class="eyebrow">' + esc(S.eyebrow) + '</div>' : '') +
      '<h1>' + esc(S.title || "교육 자료실") + '</h1>' +
      (S.desc ? '<p>' + esc(S.desc) + '</p>' : '') + '</section>';

    if (!V.length){
      html += '<p class="empty" style="margin-top:28px">아직 등록된 강의가 없어요.</p>';
      $("app").innerHTML = html; return;
    }
    var f = V[0], nf = (f.files || []).length;
    html += '<a class="feature" href="' + videoUrl(f.id) + '">' + thumbBox(f, true) +
      '<div class="body">' +
        '<div class="label">' + (SC.isNew(f.date) ? '<span class="chip new">NEW</span>' : '') + '최신 강의</div>' +
        '<h2>' + esc(f.title || "제목 없음") + '</h2>' + metaLine(f) +
        (nf ? '<span class="files-count">' + IC.file + '교육자료 ' + nf + '개</span>' : '') +
        '<span class="btn">영상 보고 자료 받기' + IC.arrow + '</span>' +
      '</div></a>';

    if (V.length > 1){
      html += '<section aria-labelledby="allH"><div class="section-head"><h2 id="allH">전체 강의<small>' + V.length + '</small></h2>' +
        (V.length > 6 ? '<label class="search">' + IC.search + '<input id="q" type="search" placeholder="강의 제목으로 찾기" aria-label="강의 제목으로 찾기"></label>' : '') +
        '</div><ul class="grid" id="grid"></ul><p class="empty" id="none" hidden>찾는 강의가 없어요.</p></section>';
    }
    $("app").innerHTML = html;
    if (V.length > 1){
      var draw = function(q){
        q = String(q || "").trim().toLowerCase();
        var list = q ? V.filter(function(v){ return (v.title || "").toLowerCase().indexOf(q) > -1; }) : V;
        $("grid").innerHTML = list.map(card).join("");
        $("none").hidden = list.length > 0;
      };
      draw("");
      if ($("q")) $("q").addEventListener("input", function(){ draw(this.value); });
    }
  }

  /* ---------- 영상 페이지 ---------- */
  function renderVideo(data, id){
    var S = data.site || {}, V = data.videos || [];
    var v = V.filter(function(x){ return x.id === id; })[0];
    $("back").hidden = false; $("brand").hidden = true;
    if (!v){
      document.title = "강의를 찾을 수 없어요";
      $("app").innerHTML = '<div class="state"><h1>강의를 찾을 수 없어요</h1><p>삭제되었거나 주소가 바뀌었을 수 있어요.</p><a class="btn" href="./">전체 강의 보기</a></div>';
      return;
    }
    document.title = (v.title || "강의") + " · " + (S.title || "교육 자료실");

    var files = (v.files || []).map(function(f){
      var sn = SC.splitName(f.name), t = f.type || sn.type || "pdf", d = SC.download(f.link, t);
      var cls = { pdf:"pdf", xlsx:"xlsx", pptx:"pptx", docx:"docx", hwp:"hwp" }[t] || "etc";
      var btn = d.url
        ? '<a class="dl" href="' + esc(d.url) + '" rel="noopener" aria-label="' + esc(sn.name) + ' 다운로드">' + IC.dl + '<span>받기</span></a>'
        : '<span class="dl off">준비 중</span>';
      return '<li class="file"><span class="ftype ' + cls + '">' + SC.typeLabel(t) + '</span>' +
        '<div class="fname"><strong>' + esc(sn.name) + '</strong>' + (f.size ? '<span>' + esc(f.size) + '</span>' : '') + '</div>' + btn + '</li>';
    }).join("");

    var others = V.filter(function(x){ return x.id !== v.id; }).slice(0, 6);

    $("app").innerHTML =
      '<div class="watch">' +
        '<div class="player-box"><div class="player">' +
          '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.id) + '?rel=0&playsinline=1&modestbranding=1" title="' + esc(v.title || "강의 영상") + '" ' +
          'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
        '</div></div>' +
        '<div class="info">' +
          '<h1>' + esc(v.title || "제목 없음") + '</h1>' +
          '<div class="info-row">' + metaLine({ channel:v.channel, date:v.date }) +
            '<button type="button" class="btn ghost share" id="share">' + IC.link + '이 강의 링크 복사</button></div>' +
        '</div>' +
        '<aside class="side" aria-labelledby="filesH"><div class="files-card">' +
          '<h2 id="filesH">교육자료' + ((v.files || []).length ? '<small>' + v.files.length + '개</small>' : '') + '</h2>' +
          (files ? '<ul class="files">' + files + '</ul>' : '<p class="files-empty">이 강의는 아직 자료가 없어요.</p>') +
          (files ? '<p class="files-note">받기를 누르면 바로 내려받아져요. 안 되면 크롬이나 사파리에서 열어 주세요.</p>' : '') +
        '</div></aside>' +
        (v.description ? '<section class="desc" aria-labelledby="descH"><h2 id="descH">강의 소개</h2>' +
          '<p class="desc-body clamp" id="descBody">' + SC.richText(v.description) + '</p>' +
          '<button type="button" class="more" id="more" hidden>더보기</button></section>' : '') +
      '</div>' +
      (others.length ? '<section aria-labelledby="moreH"><div class="section-head"><h2 id="moreH">다른 강의</h2></div><ul class="grid">' + others.map(card).join("") + '</ul></section>' : '');

    $("share").addEventListener("click", function(){
      var url = location.origin + location.pathname + "?v=" + encodeURIComponent(v.id);
      SC.copy(url).then(function(){ toast("링크를 복사했어요. 카톡에 붙여 넣으세요"); }, function(){ toast(url); });
    });
    var body = $("descBody");
    if (body){
      requestAnimationFrame(function(){
        if (body.scrollHeight > body.clientHeight + 2){
          $("more").hidden = false;
          $("more").addEventListener("click", function(){ var c = body.classList.toggle("clamp"); this.textContent = c ? "더보기" : "접기"; });
        } else body.classList.remove("clamp");
      });
    }
  }

  /* ---------- 시작 ---------- */
  fetch("data/videos.json?t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      var S = data.site || {};
      if (S.title) $("brandName").textContent = S.title.replace(/\s*교육\s*자료실\s*$/, "") || S.title;
      $("notice").textContent = S.notice ? "※ " + S.notice : "";
      var id = new URLSearchParams(location.search).get("v");
      if (id) renderVideo(data, id); else renderHome(data);
      window.scrollTo(0, 0);
    })
    .catch(function(){
      $("app").innerHTML = '<div class="state"><h1>목록을 불러오지 못했어요</h1><p>잠시 후 새로고침해 주세요.</p></div>';
    });
})();
</script>
</body>
</html>
