<script>
(function(){
  var esc = SC.esc, $ = function(id){ return document.getElementById(id); };
  var TAB_TITLE = "영개파 교육 자료"; /* 브라우저 탭에 항상 이 이름 */

  var REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var IC = {
    play: '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>',

    check: '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',

    person: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5z"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="14" height="13" rx="3"/><path d="m16.5 10.5 5-3v9l-5-3"/></svg>',
    videoX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="14" height="13" rx="3"/><path d="m16.5 10.5 5-3v9l-5-3M7 9.5l5 5M12 9.5l-5 5"/></svg>',
    folderDl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/></svg>',
    folderX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M10 11.5l4 4M14 11.5l-4 4"/></svg>',
    warn: '<svg class="lec-note-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.9 18.2A2 2 0 0 0 3.6 21h16.8a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z" fill="#FFD25E"/><path d="M12 9v4.5" stroke="#0B1030" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.25" fill="#0B1030"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
  };

  /* ---------- 토스트 ---------- */
  var toastT;
  function toast(msg, icon){
    var t = $("toast");
    t.innerHTML = (icon || IC.check) + '<span>' + esc(msg) + '</span>';
    t.classList.remove("show"); void t.offsetWidth;
    t.classList.add("show"); clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  /* ---------- 라이트 / 다크 (#18 · M4) — common.js ---------- */
  SC.themeUI({ tm: $("tm"), ic: $("tmIc") });

  /* ---------- 주소 ---------- */
  function menuUrl(m, page, q){
    var u = ROOT + m + "/", p = [];
    if (q) p.push("q=" + encodeURIComponent(q));
    if (page > 1) p.push("page=" + page);
    return u + (p.length ? "?" + p.join("&") : "");
  }
  function videoUrl(id){ return ROOT + "v/" + encodeURIComponent(id) + "/"; }
  /* 상품연구 전략자료: research/ → research/2611/ → research/2611/{연령ID}/ */
  function rUrl(code, age, page){
    return ROOT + "research/" + (code ? code + "/" + (age ? encodeURIComponent(age) + "/" : "") : "") + (page > 1 ? "?page=" + page : "");
  }
  function isMenu(m){ return SC.MENUS.some(function(x){ return x.id === m; }); }
  function parse(){
    var rel = decodeURIComponent(location.pathname).slice(decodeURIComponent(new URL(ROOT).pathname).length);
    var q = new URLSearchParams(location.search), m;
    var page = Math.max(1, parseInt(q.get("page"), 10) || 1);
    var v = q.get("v") || ((m = rel.match(/^v\/([\w-]{6,})\/?(?:index\.html)?$/)) ? m[1] : "");
    if (v) return { v: v };
    var rq = q.get("r");
    if (rq != null){ var sp = rq.split("/"); return { r: true, ym: sp[0] || "", age: sp[1] || "", page: page }; }
    if ((m = rel.match(/^research(?:\/(\d{4}))?(?:\/([\w-]+))?\/?(?:index\.html)?$/))) return { r: true, ym: m[1] || "", age: m[2] || "", page: page };
    var c = q.get("c") || ((m = rel.match(/^([a-z]+)\/?(?:index\.html)?$/)) ? m[1] : "");
    if (c === "research") return { r: true, ym: "", age: "", page: page };
    return { m: isMenu(c) ? c : "all", page: page, q: q.get("q") || "" };
  }

  /* ---------- 데이터 ---------- */
  var DATA = { site:{}, videos:[] }, RES = { months:[] };
  function pub(){ return (DATA.videos || []).filter(SC.isPublic); }
  function newest(list){
    return list.map(function(v, i){ return { v:v, i:i }; })
      .sort(function(a, b){ return String(b.v.publishedAt || b.v.date || "").localeCompare(String(a.v.publishedAt || a.v.date || "")) || a.i - b.i; })
      .map(function(x){ return x.v; });
  }
  /* 전체·메뉴 모두 유튜브에 올린 날짜 최신순 (상품연구 전략자료는 '전체'에 넣지 않음) */
  function listOf(m){
    return newest(m === "all" ? pub() : pub().filter(function(v){ return SC.catOf(v) === m; }));
  }
  function ymCode(ym){ var x = String(ym || "").match(/^(\d{4})-(\d{2})$/); return x ? x[1].slice(2) + x[2] : ""; }
  function rMonths(){
    return (RES.months || []).filter(function(m){ return SC.isPublic(m) && ymCode(m.ym); })
      .sort(function(a, b){ return String(b.ym).localeCompare(String(a.ym)); });
  }
  function rAges(m){ return (m.ages || []).filter(SC.isPublic); }
  function rFileCount(m){ return rAges(m).reduce(function(n, a){ return n + (a.files || []).length; }, 0); }
  function findMonth(code){ return rMonths().filter(function(m){ return ymCode(m.ym) === code; })[0]; }

  /* ---------- 공통 조각 ---------- */
  function setBody(cls){
    ["watch-page", "back-page", "no-fab"].forEach(function(c){ document.body.classList.toggle(c, (" " + cls + " ").indexOf(" " + c + " ") > -1); });
  }
  function setBarBack(href, text){ $("barBack").href = href; $("barBackText").textContent = text; }
  /* M6 메뉴 밑줄: 하나를 따로 두고 다음 메뉴 자리로 미끄러짐 (처음엔 아래에서 자라남) */
  function placeUl(anim){
    var mn = $("menu"), ul = mn.querySelector(".menu-ul"), act = mn.querySelector("[aria-current]");
    if (!ul) return;
    if (!act || !act.offsetWidth){ ul.hidden = true; delete ul.dataset.x; return; }
    var x = act.offsetLeft, w = act.offsetWidth;
    ul.hidden = false; ul.dataset.x = x; ul.dataset.w = w;
    if (!anim) ul.classList.remove("go");
    ul.style.transform = "translateX(" + x + "px)"; ul.style.width = w + "px";
  }
  function menuFade(){ $("menuBox").classList.toggle("cut", $("menu").scrollLeft > 2); }
  function drawMenu(cur){
    var mn = $("menu"), old = mn.querySelector(".menu-ul"), from = old && old.dataset.x != null && !old.hidden ? { x: +old.dataset.x, w: +old.dataset.w } : null;
    mn.innerHTML = SC.MENUS.map(function(c){
      return '<a href="' + (c.id === "research" ? rUrl() : menuUrl(c.id)) + '" data-go' + (c.id === cur ? ' aria-current="page"' : '') + '>' + esc(c.label) + '</a>';
    }).join("") + '<span class="menu-ul" aria-hidden="true" hidden></span>';
    var ul = mn.querySelector(".menu-ul"), act = mn.querySelector("[aria-current]");
    if (act && act.offsetWidth && !REDUCE){
      if (from && from.x !== act.offsetLeft){
        ul.hidden = false; ul.style.transform = "translateX(" + from.x + "px)"; ul.style.width = from.w + "px";
        void ul.offsetWidth; ul.classList.add("go");
      } else if (!from) ul.classList.add("grow");
    }
    placeUl(true);
    /* 고른 메뉴가 화면 밖이면 보이게만 (보이면 그대로 두어 '전체'가 잘리지 않게) */
    if (act){
      var a = act.getBoundingClientRect(), r = mn.getBoundingClientRect();
      if (a.right > r.right) mn.scrollLeft += a.right - r.right + 16;
      else if (a.left < r.left) mn.scrollLeft -= r.left - a.left + 16;
    }
    menuFade();
  }
  $("menu").addEventListener("scroll", menuFade, { passive:true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ placeUl(false); });
  window.addEventListener("resize", function(){ placeUl(false); menuFade(); });

  /* M3 제목 숫자 0 → 실제 수 */
  function countUp(){
    var el = document.querySelector("#listH [data-count]"); if (!el) return;
    var n = +el.dataset.count; if (REDUCE || !n) return;
    el.textContent = "0";
    var t0 = null;
    function step(ts){
      if (!el.isConnected) return;
      if (t0 === null) t0 = ts;
      var p = Math.max(0, Math.min(1, (ts - t0 - 220) / 700));
      el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  /* M8 구역 스크롤 등장: 화면 아래에 있는 구역만, 처음 들어올 때 한 번 */
  var io = (!REDUCE && "IntersectionObserver" in window) ? new IntersectionObserver(function(ents){
    var k = 0;
    ents.forEach(function(e){
      if (!e.isIntersecting) return;
      var el = e.target; io.unobserve(el);
      el.style.animationDelay = (k++ * 120) + "ms";
      el.classList.remove("rv"); el.classList.add("rv-in");
    });
  }, { rootMargin: "0px 0px -10% 0px" }) : null;
  function reveal(sel){
    if (!io) return;
    document.querySelectorAll(sel).forEach(function(el){
      if (el.getBoundingClientRect().top < innerHeight * 0.9) return;
      el.classList.add("rv"); io.observe(el);
    });
  }

  function metaText(v, withDur){
    var d = SC.fmtDate(v.date), p = [];
    if (d) p.push('<span class="nowrap">' + d + '</span>');
    if (withDur && v.duration) p.push('<span class="nowrap">' + esc(v.duration) + '</span>');
    var rest = p.join(" · ");
    if (!v.channel) return rest;
    return rest ? '<span class="ch">' + esc(v.channel) + ' · </span>' + rest : esc(v.channel);
  }
  function menuBadge(v){
    var c = SC.catOf(v);
    return '<span class="mbadge" data-menu="' + c + '">' + esc(SC.catLabel(c)) + '</span>';
  }
  function card(v, withMenu){
    var n = (v.files || []).length;
    return '<li><a class="card rp" href="' + videoUrl(v.id) + '" data-go>' +
      '<div class="thumb">' + SC.thumbImg(v.id) +
        (SC.isNew(v.date) ? '<span class="chip-new">NEW</span>' : '') +
        (v.duration ? '<span class="chip-dur">' + esc(v.duration) + '</span>' : '') +
        '<span class="play" aria-hidden="true">' + IC.play + '</span></div>' +
      '<div class="card-body">' + (withMenu ? '<div>' + menuBadge(v) + '</div>' : '') +
        '<h3>' + esc(v.title || "제목 없음") + '</h3>' +
        '<div class="card-meta"><span class="date">' + metaText(v) + '</span>' +
          (n ? '<span class="chip-files">' + IC.dl + '자료&nbsp;' + n + '개</span>' : '') + '</div></div></a></li>';
  }
  /* 상품연구 카드 (월 · 연령): 썸네일 없으면 흰 바탕 로고 기본 썸네일 */
  var RDEF = "assets/research-default.png";
  function rThumb(src, cls, eager){
    return '<div class="thumb r-th' + (cls ? " " + cls : "") + (src ? "" : " dflt") + '">' +
      '<img src="' + esc(src || RDEF) + '" alt=""' + (src ? "" : ' data-default="true"') + (eager ? "" : ' loading="lazy"') + '></div>';
  }
  function rCard(href, thumb, title, left, n){
    return '<li><a class="card r-card rp" href="' + href + '" data-go>' + rThumb(thumb) +
      '<div class="card-body"><h3>' + esc(title || "제목 없음") + '</h3>' +
        '<div class="card-meta">' + (left ? '<span class="r-sub">' + left + '</span>' : '') +
          '<span class="chip-files">' + IC.dl + '자료&nbsp;' + n + '개</span></div></div></a></li>';
  }

  /* ---------- 목록 화면 (전체 · 메뉴 · 상품연구 월/연령) ---------- */
  var L = null;            /* 지금 목록 상태 { m, page, q, items, card, search, url } */

    var all = L.items, q = norm(L.q);

  function pageList(cur, total){
    if (total <= 7){ var a = []; for (var i = 1; i <= total; i++) a.push(i); return a; }
    var out = [1];
    if (cur - 1 > 2) out.push("…");
    for (var k = Math.max(2, cur - 1); k <= Math.min(total - 1, cur + 1); k++) out.push(k);
    if (cur + 1 < total - 1) out.push("…");
    out.push(total);
    return out;
  }

    var u = L.url(L.page, L.q);

  function toListTop(){

  /* M10 빛 라인 리빌로 감싸기: 목록(1.05초) · 자료/소개(0.85초) */

  }
  function listBody(d){ return lrBox('<div class="lr-c" id="listBody"></div>', d, 0, "listLr"); }
  /* 화면에 보이면 바로, 아래에 있으면 처음 들어올 때 재생 (그 전엔 내용을 접어 둠) */
  var lrIo = (!REDUCE && "IntersectionObserver" in window) ? new IntersectionObserver(function(ents){
    ents.forEach(function(e){ if (!e.isIntersecting) return; lrIo.unobserve(e.target); e.target.classList.remove("wait"); SC.lineReveal(e.target); });
  }, { rootMargin: "0px 0px -10% 0px" }) : null;

    toast("다운로드를 시작했어요. 잠시만 기다려 주세요", IC.dl);
    setTimeout(function(){
      a.classList.remove("busy"); a.classList.add("done"); a.innerHTML = IC.check + '<span>요청됨</span>';
      setTimeout(function(){ a.classList.remove("done"); a.innerHTML = orig; }, 5000);
    }, 3500);
  });

  SC.ripple();
  SC.fab({ foot: ".foot", main: "#app" });

  /* 고지 문구: 첫 줄은 노란 강조, 둘째 줄은 쉼표 기준으로 두 덩어리(줄바꿈이 깔끔하게) */
  var NOTICE_SRC = "";
  function noticeHtml(){
    var lines = SC.noticeText(NOTICE_SRC).split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    var html = '<strong>' + esc(lines.shift() || "") + '</strong>';
    lines.forEach(function(l){
      var cut = -1, best = 1e9;
      l.replace(/, /g, function(m, i){ var d = Math.abs(i - l.length / 2); if (d < best){ best = d; cut = i; } return m; });
      html += '<br>' + (cut > 0
        ? '<span class="chunk">' + esc(l.slice(0, cut + 1)) + '</span> <span class="chunk">' + esc(l.slice(cut + 2)) + '</span>'
        : esc(l));
    });
    return html;
  }
  function drawNotice(s){ NOTICE_SRC = s || ""; $("notice").innerHTML = noticeHtml(); }
  drawNotice("");

  var T = Date.now();
  Promise.all([
    fetch(ROOT + "data/videos.json?t=" + T, { cache:"no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }),
    /* 상품연구 자료는 따로 (아직 파일이 없으면 빈 목록) */
    fetch(ROOT + "data/research.json?t=" + T, { cache:"no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
  ]).then(function(res){
    DATA = res[0] || DATA;
    RES = (res[1] && res[1].months) ? res[1] : { months:[] };
    drawNotice((DATA.site || {}).notice);
    route();
  }).catch(function(){
    var p = parse();
    drawMenu(p.r ? "research" : (p.m || "all"));
    setBody("no-fab");
    $("app").innerHTML = '<div class="state"><span class="state-ic">' + IC.videoX + '</span><h1>목록을 불러오지 못했어요</h1><p>잠시 후 새로고침해 주세요.</p></div>';
  });
})();
</script>
</body>
</html>
