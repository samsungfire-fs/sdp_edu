  function menuUrl(m, page, q){
    var u = ROOT + m + "/", p = [];
    if (q) p.push("q=" + encodeURIComponent(q));
    if (page > 1) p.push("page=" + page);
    return u + (p.length ? "?" + p.join("&") : "");
  }
  function videoUrl(id){ return ROOT + "v/" + encodeURIComponent(id) + "/"; }
  /* 상품연구 전략자료: research/ → research/2611/ → research/2611/{연령ID}/ */
  function rUrl(code, age, page){
    return ROOT + "research/" + (code ? code + "/" + (age ? encodeURIComponent(age) + "/" : "") : "") + (page > 1 ? "?page=" + page : "");
  }
  function isMenu(m){ return SC.MENUS.some(function(x){ return x.id === m; }); }
  function parse(){
    var rel = decodeURIComponent(location.pathname).slice(decodeURIComponent(new URL(ROOT).pathname).length);
    var q = new URLSearchParams(location.search), m;
    var page = Math.max(1, parseInt(q.get("page"), 10) || 1);
    var v = q.get("v") || ((m = rel.match(/^v\/([\w-]{6,})\/?(?:index\.html)?$/)) ? m[1] : "");
    if (v) return { v: v };
    var rq = q.get("r");
    if (rq != null){ var sp = rq.split("/"); return { r: true, ym: sp[0] || "", age: sp[1] || "", page: page }; }
    if ((m = rel.match(/^research(?:\/(\d{4}))?(?:\/([\w-]+))?\/?(?:index\.html)?$/))) return { r: true, ym: m[1] || "", age: m[2] || "", page: page };
    var c = q.get("c") || ((m = rel.match(/^([a-z]+)\/?(?:index\.html)?$/)) ? m[1] : "");
    if (c === "research") return { r: true, ym: "", age: "", page: page };
    return { m: isMenu(c) ? c : "all", page: page, q: q.get("q") || "" };
  }

  /* ---------- 데이터 ---------- */

  /* 기획 P5-2: 관리자 사번으로 로그인하면 비공개 강의 · 월 · 연령도 보임(비공개 표시와 함께) */
  function vis(x){ return SC.isPublic(x) || (!!x && isAdm()); }
  function pub(){ return (DATA.videos || []).filter(vis); }
  function newest(list){

  function rMonths(){

  /* M6 메뉴 밑줄: 하나를 따로 두고 다음 메뉴 자리로 미끄러짐 (처음엔 아래에서 자라남) */
  function placeUl(anim){
    var mn = $("menu"), ul = mn.querySelector(".menu-ul"), act = mn.querySelector("[aria-current]");
    if (!ul) return;
    if (!act || !act.offsetWidth){ ul.hidden = true; delete ul.dataset.x; return; }
    var x = act.offsetLeft, w = act.offsetWidth;
    ul.hidden = false; ul.dataset.x = x; ul.dataset.w = w;
    if (!anim) ul.classList.remove("go");
    ul.style.transform = "translateX(" + x + "px)"; ul.style.width = w + "px";
  }
  function menuFade(){ $("menuBox").classList.toggle("cut", $("menu").scrollLeft > 2); }
  function drawMenu(cur){
    var mn = $("menu"), old = mn.querySelector(".menu-ul"), from = old && old.dataset.x != null && !old.hidden ? { x: +old.dataset.x, w: +old.dataset.w } : null;
    mn.innerHTML = SC.MENUS.map(function(c){
      return '<a href="' + (c.id === "research" ? rUrl() : menuUrl(c.id)) + '" data-go' + (c.id === cur ? ' aria-current="page"' : '') + '>' + esc(c.label) + '</a>';
    }).join("") + '<span class="menu-ul" aria-hidden="true" hidden></span>';
    var ul = mn.querySelector(".menu-ul"), act = mn.querySelector("[aria-current]");
    if (act && act.offsetWidth && !REDUCE){
      if (from && from.x !== act.offsetLeft){
        ul.hidden = false; ul.style.transform = "translateX(" + from.x + "px)"; ul.style.width = from.w + "px";
        void ul.offsetWidth; ul.classList.add("go");
      } else if (!from) ul.classList.add("grow");
    }
    placeUl(true);
    /* 고른 메뉴가 화면 밖이면 보이게만 (보이면 그대로 두어 '전체'가 잘리지 않게) */
    if (act){
      var a = act.getBoundingClientRect(), r = mn.getBoundingClientRect();
      if (a.right > r.right) mn.scrollLeft += a.right - r.right + 16;
      else if (a.left < r.left) mn.scrollLeft -= r.left - a.left + 16;
    }
    menuFade();
  }

  /* 고지 문구: 첫 줄은 노란 강조, 둘째 줄은 쉼표 기준으로 두 덩어리(줄바꿈이 깔끔하게) */
  var NOTICE_SRC = "";
  function noticeHtml(){
    var lines = SC.noticeText(NOTICE_SRC).split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    var html = '<strong>' + esc(lines.shift() || "") + '</strong>';
    lines.forEach(function(l){
      var cut = -1, best = 1e9;
      l.replace(/, /g, function(m, i){ var d = Math.abs(i - l.length / 2); if (d < best){ best = d; cut = i; } return m; });
      html += '<br>' + (cut > 0
        ? '<span class="chunk">' + esc(l.slice(0, cut + 1)) + '</span> <span class="chunk">' + esc(l.slice(cut + 2)) + '</span>'
        : esc(l));
    });
    return html;
  }
  function drawNotice(s){ NOTICE_SRC = s || ""; $("notice").innerHTML = noticeHtml(); }
  drawNotice("");

  /* ================= 사이트 사번 로그인 · 이름 · 조회수 · 다운로드 수 (기획 P2 · P4 · P5-2 · 디자인 #47) =================
     - 강의 · 자료 목록은 저장소에 잠가 둔 data/*.enc.json (관리자가 저장할 때 잠금). 잠긴 목록이 있으면 로그인해야 보임.
     - 로그인하면 세일즈온 사번 목록이 그날 밤 12시까지 쓸 표 + 목록 열쇠를 줌 → 이 브라우저에 보관(그날은 다시 묻지 않음).
     - 접속(10분에 한 번) · 강의 열기 · [받기]를 사번 목록에 기록. 숫자는 사번 목록이 1분마다 새로 셈(관리자는 뺌). */
  var S_KEY = "sdp-site", GATE = "", LOCKED = false, WRAP = null, SES = null, STATS = null, booted = false;
  function kstNow(){ return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 19); }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
  function sesRaw(){ try { return JSON.parse(lsGet(S_KEY) || "null"); } catch(e){ return null; } }
  function sesSet(o){ lsSet(S_KEY, o ? JSON.stringify(o) : null); }
  function devId(){ var d = lsGet("sdp-dev"); if (!d){ d = Math.random().toString(36).slice(2) + Date.now().toString(36); lsSet("sdp-dev", d); } return d; }
  function isAdm(){ return !!(SES && SES.a && SES.e > kstNow()); }
  function live(){ return !!(LOCKED && SES && SES.e > kstNow()); }
  function expired(){ return !!(LOCKED && booted && !live()); }
  function gate(body, keep){
    return fetch(GATE, { method:"POST", body: JSON.stringify(body), cache:"no-store", redirect:"follow", keepalive: !!keep })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function track(action, key){
    if (!live() || !GATE) return;
    var b = { action: action, t: SES.t }; if (key) b.key = key;
    gate(b, true).catch(function(){});
  }
  function seen(){
    if (!live()) return;
    var k = "sdp-seen-" + SES.s, last = +(lsGet(k) || 0);
    if (Date.now() - last < 10 * 60 * 1000) return;
    lsSet(k, String(Date.now())); track("siteSeen");
  }

  /* 숫자: 1,234 · 1만 넘으면 1.2만 */
  function fmtN(n){
    n = n || 0;
    if (n >= 10000){ var x = Math.round(n / 1000) / 10; return (x % 1 ? x.toFixed(1) : String(x)) + "만"; }
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function vwHtml(id){
    if (!LOCKED) return "";
    var k = "v:" + id, n = STATS ? (STATS.views[k] || 0) : 0;
    return '<span class="vw" data-vw="' + esc(k) + '"' + (STATS ? '' : ' hidden') + '>' + IC.eye + '<span>조회 ' + fmtN(n) + '</span></span>';
  }
  function dnHtml(key){
    if (!LOCKED || !key) return "";
    var n = STATS ? (STATS.downs[key] || 0) : 0;
    return '<span class="dn" data-dn="' + esc(key) + '"' + (STATS ? '' : ' hidden') + '>' + IC.dn + '<span>' + fmtN(n) + '명</span></span>';
  }
  function privTag(){ return '<span class="priv" aria-hidden="true"><span>' + IC.lock + '비공개 · 관리자에게만 보여요</span></span>'; }
  function paintStats(){
    if (!STATS) return;
    document.querySelectorAll("[data-vw]").forEach(function(el){ el.hidden = false; el.lastChild.textContent = "조회 " + fmtN(STATS.views[el.dataset.vw] || 0); });
    document.querySelectorAll("[data-dn]").forEach(function(el){ el.hidden = false; el.lastChild.textContent = fmtN(STATS.downs[el.dataset.dn] || 0) + "명"; });
  }
  function loadStats(){
    if (!live()) return;
    gate({ action:"siteStats", t: SES.t }).then(function(r){
      if (r.ok){ STATS = { views: r.views || {}, downs: r.downs || {} }; paintStats(); }
      else if (r.error === "nosession"){ sesSet(null); SES = null; showLogin(""); }
    }).catch(function(){});
  }
  /* [받기]: 기록 + 내가 처음 받는 자료면 숫자를 바로 +1 (관리자는 세지 않음) */
  function mine(){ try { return JSON.parse(lsGet("sdp-dl-" + SES.s) || "{}"); } catch(e){ return {}; } }
  function downed(key){
    if (!live() || !key) return;
    track("siteDown", key);
    var m = mine(); if (m[key]) return;
    m[key] = 1; lsSet("sdp-dl-" + SES.s, JSON.stringify(m));
    if (!STATS || SES.a) return;
    STATS.downs[key] = (STATS.downs[key] || 0) + 1;
    document.querySelectorAll('[data-dn="' + key.replace(/"/g, "") + '"]').forEach(function(el){
      el.hidden = false; el.lastChild.textContent = fmtN(STATS.downs[key]) + "명";
      el.classList.remove("up"); void el.offsetWidth; el.classList.add("up");
    });
  }

  /* ---------- 이름 칸 (메뉴 바 라이트/다크 왼쪽) ---------- */

  /* ---------- 로그인 화면 ---------- */
  var waitT = null;
  function showLogin(kind){
    L = null; booted = true;
    document.body.classList.add("login-mode"); setBody("no-fab"); paintWho();
    document.title = TAB_TITLE;
    $("app").innerHTML = '<div class="ulog"><form class="ulog-card" id="ulog" novalidate>' +
      (kind === "expired" ? '<p class="umsg in2" role="status">' + IC.cal + '<span>날짜가 바뀌어 다시 로그인해 주세요.</span></p>' : '') +
      '<div class="ulog-h"><h1>영개파 교육 자료</h1><p>사번을 입력해 주세요.</p></div>' +
      '<div class="ulog-f"><label for="usb">사번</label>' +
        '<input id="usb" class="uin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="username" placeholder="숫자 8자리" aria-describedby="umsg">' +
        '<p class="umsg" id="umsg" role="alert" hidden></p></div>' +
      '<button type="submit" class="ubtn rp" id="ubtn">로그인</button>' +
      '<p class="unote">로그인하면 오늘 밤 12시까지 유지돼요.</p></form></div>';
    var inp = $("usb");
    inp.addEventListener("input", function(){
      var v = this.value.replace(/\D/g, "").slice(0, 8); if (v !== this.value) this.value = v;
      this.classList.remove("bad"); if (!waitT) $("umsg").hidden = true;

    $("ulog").addEventListener("submit", function(e){ e.preventDefault(); doLogin(); });
    if (!SC.inApp || !SC.inApp()) setTimeout(function(){ try { inp.focus({ preventScroll:true }); } catch(er){} }, 60);
  }
  function loginMsg(cls, html, bad){
    var m = $("umsg"), ic = cls === "er" ? IC.alert : (cls === "wa" && /잠시 후 다시 시도/.test(html) && !/할 수 없어요/.test(html)) ? IC.clock : IC.tri;
    m.className = "umsg " + cls; m.innerHTML = ic + '<span>' + html + '</span>'; m.hidden = false;
    $("usb").classList.toggle("bad", !!bad); if (bad) $("usb").setAttribute("aria-invalid", "true"); else $("usb").removeAttribute("aria-invalid");
  }
  function doLogin(){
    var inp = $("usb"), btn = $("ubtn"), v = inp.value.replace(/\s+/g, "");
    if (waitT) return;
    if (!v){ loginMsg("er", "사번을 입력해 주세요.", true); inp.focus(); return; }
    inp.disabled = true; btn.disabled = true; btn.classList.add("busy"); btn.setAttribute("aria-busy", "true");
    btn.innerHTML = '<span class="spin">' + IC.spin + '</span>확인 중…';
    function done(){ inp.disabled = false; btn.classList.remove("busy"); btn.removeAttribute("aria-busy"); btn.textContent = "로그인"; btn.disabled = !!waitT; }
    gate({ action:"siteLogin", sabun: v, dev: devId() }).then(function(r){
      if (r.ok){
        SES = { t: r.t, s: r.sabun, n: r.name, a: r.admin ? 1 : 0, e: r.exp, k: r.key };
        sesSet(SES); lsSet("sdp-seen-" + SES.s, String(Date.now()));   /* 로그인 자체가 접속 기록 */
        return enter();
      }
      done();
      if (r.error === "notnormal") loginMsg("er", "정상회원이 아닙니다", true);
      else if (r.error === "nouser") loginMsg("er", "등록되지 않은 사번이에요. 다시 확인해 주세요.", true);
      else if (r.error === "empty") loginMsg("er", "사번을 입력해 주세요.", true);
      else if (r.error === "wait"){
        loginMsg("wa", "잠시 후 다시 시도해 주세요.", false);
        btn.disabled = true; clearTimeout(waitT);
        waitT = setTimeout(function(){ waitT = null; var b = $("ubtn"); if (b) b.disabled = false; var m = $("umsg"); if (m) m.hidden = true; }, 60 * 1000);
      }
      else loginMsg("wa", "지금은 로그인할 수 없어요.<br>잠시 후 다시 시도해 주세요.", false);
      inp.focus();
    }).catch(function(){ done(); loginMsg("wa", "지금은 로그인할 수 없어요.<br>잠시 후 다시 시도해 주세요.", false); });
  }

  /* ---------- 목록 열기 · 화면 그리기 ---------- */
  function enter(){
    return Promise.all([SC.box.open(WRAP[0], SES.k), WRAP[1] ? SC.box.open(WRAP[1], SES.k) : null]).then(function(o){
      DATA = o[0] || DATA; RES = (o[1] && o[1].months) ? o[1] : { months:[] };
      booted = true;
      document.body.classList.remove("login-mode");
      drawNotice((DATA.site || {}).notice);
      route(); window.scrollTo(0, 0);
      paintWho(); loadStats(); seen();
    }).catch(function(){
      /* 열쇠가 바뀌었거나 표가 맞지 않으면 다시 로그인 */
      sesSet(null); SES = null; showLogin("");
    });
  }
  /* 링크 복사처럼 화면을 바꾸지 않는 동작 중에 로그인이 끝났으면: 토스트 후 로그인 화면 */
  document.addEventListener("click", function(e){
    if (!e.target.closest("#share") || !expired()) return;
    e.stopImmediatePropagation(); e.preventDefault();
    toast("날짜가 바뀌어 다시 로그인해 주세요.", IC.cal);
    setTimeout(function(){ showLogin("expired"); window.scrollTo(0, 0); }, 1200);
  }, true);

  /* 불러오는 중: 0.3초 안에 오면 뼈대 없이 바로 */
  function skeleton(){
    if (booted) return;
    var p = parse(), sk = '<li><div class="sk-th"></div><div class="sk-l"></div><div class="sk-l s"></div></li>';
    if (p.v || (p.r && p.age)){
      $("app").innerHTML = '<div class="sk-watch" aria-busy="true" aria-label="불러오는 중"><div class="sk-player"></div><div class="sk-side">' +
        '<div class="sk-l" style="width:40%"></div><div class="sk-l" style="width:80%;height:22px"></div>' +
        new Array(4).join('<div class="sk-file"><span class="sk-ic"></span><span class="sk-tx"><span class="sk-l"></span><span class="sk-l s"></span></span><span class="sk-btn"></span></div>') + '</div></div>';
    } else {
      $("app").innerHTML = '<section class="list-page" aria-busy="true" aria-label="불러오는 중"><div class="list-head"><div class="sk-l" style="width:220px;height:34px"></div></div>' +
        '<ul class="grid vgrid skel" aria-hidden="true">' + new Array(cols() * 2 + 1).join(sk) + '</ul></section>';
    }
  }
  setTimeout(skeleton, 300);

  var T = Date.now();
  function getJson(path){ return fetch(ROOT + path + "?t=" + T, { cache:"no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }
  function failed(){
    booted = true;
    var p = parse();
    drawMenu(p.r ? "research" : (p.m || "all"));
    setBody("no-fab");
    $("app").innerHTML = '<div class="state"><span class="state-ic">' + IC.videoX + '</span><h1>목록을 불러오지 못했어요</h1><p>잠시 후 새로고침해 주세요.</p></div>';
  }
  Promise.all([getJson("data/videos.enc.json"), getJson("data/research.enc.json")]).then(function(enc){
    if (enc[0] && enc[0].ct){
      LOCKED = true; WRAP = enc; GATE = enc[0].gate || "";
      var raw = sesRaw();
      SES = raw && raw.t && raw.k && raw.e > kstNow() ? raw : null;
      if (!SES){ if (raw) sesSet(null); showLogin(raw && raw.t ? "expired" : ""); return; }
      if (!SC.box.ok){ failed(); return; }
      return enter();
    }
    /* 아직 잠그기 전(관리자가 사번 목록 v18로 저장하기 전): 예전처럼 누구나 */
    return Promise.all([getJson("data/videos.json"), getJson("data/research.json")]).then(function(res){
      if (!res[0]) throw new Error("nodata");
      booted = true;
      DATA = res[0]; RES = (res[1] && res[1].months) ? res[1] : { months:[] };
      drawNotice((DATA.site || {}).notice);
      route();
    });
  }).catch(failed);
})();
</script>
</body>
</html>
